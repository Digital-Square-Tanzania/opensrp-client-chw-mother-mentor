// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "io.codearte.gradle.nexus:gradle-nexus-staging-plugin:0.11.0"
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

configure(allprojects) { project ->

    version = VERSION_NAME
    group = GROUP
    buildscript {
        repositories {
            google()
            mavenCentral()
            maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
            mavenLocal()
        }
    }
}

def githubProperties = new Properties()
if (rootProject.file("github.properties").exists()) {
    githubProperties.load(new FileInputStream(rootProject.file("github.properties")))
}

def addGithubPackagesRepository = { RepositoryHandler repositories, String repositoryName ->
    repositories.maven {
        name = "GitHubPackages-${repositoryName}"
        url = uri("https://maven.pkg.github.com/Digital-Square-Tanzania/${repositoryName}")
        credentials {
            username = githubProperties['gpr.usr'] ?: System.getenv("GITHUB_ACTOR")
            password = githubProperties['gpr.key'] ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

subprojects {

    group = 'org.smartregister'

    ext.androidToolsBuildGradle     = '7.4.2'
    ext.androidBuildToolsVersion    = '30.0.3'
    ext.androidMinSdkVersion        = 21
    ext.androidCompileSdkVersion    = 33
    ext.androidTargetSdkVersion     = 33

    ext.androidAnnotationsVersion = '3.0.1'
    ext.androidAnnotationsAPIVersion = '3.0.1'

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://acra.googlecode.com/svn/repository/releases" }
        maven { url "https://repo.maven.apache.org/maven2" }
        maven { url "https://cloudant.github.io/cloudant-sync-eap/repository" }
        maven { url "https://s3.amazonaws.com/repo.commonsware.com" }
        mavenLocal()
        [
                'CircleProgressbar.git',
                'opensrp-client-core',
                'opensrp-client-native-form',
                'opensrp-client-configurable-views',
                'opensrp-client-utils',
                'opensrp-plan-evaluator',
                'opensrp-client-simprints',
                'opensrp-client-materialedittext'
        ].each { addGithubPackagesRepository(repositories, it) }
    }

    configurations.all {
        exclude group: 'io.github.bluecodesystems', module: 'opensrp-client-core'
        exclude group: 'io.github.bluecodesystems', module: 'android-p2p-sync'
        exclude group: 'io.github.bluecodesystems', module: 'circleprogressbar'
        exclude group: 'net.zetetic', module: 'android-database-sqlcipher'
        exclude group: 'com.ibm.fhir'

        resolutionStrategy.force(
                'net.zetetic:sqlcipher-android:4.13.0',
                'org.mozilla:rhino:1.7.13',
                'com.fasterxml.jackson.core:jackson-annotations:2.13.5',
                'com.fasterxml.jackson.core:jackson-core:2.13.5',
                'com.fasterxml.jackson.core:jackson-databind:2.13.5',
                'org.jetbrains.kotlin:kotlin-bom:1.6.21',
                'org.jetbrains.kotlin:kotlin-stdlib:1.6.21',
                'org.jetbrains.kotlin:kotlin-stdlib-common:1.6.21',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.6.21',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.21',
                'org.jetbrains.kotlinx:kotlinx-coroutines-bom:1.6.4',
                'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4',
                'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.6.4',
                'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4',
                'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.6.4',
                'androidx.appcompat:appcompat:1.6.1',
                'androidx.appcompat:appcompat-resources:1.6.1',
                'androidx.core:core:1.9.0',
                'androidx.core:core-ktx:1.9.0',
                'androidx.activity:activity:1.5.1',
                'androidx.activity:activity-ktx:1.5.1',
                'androidx.lifecycle:lifecycle-common:2.5.1',
                'androidx.lifecycle:lifecycle-livedata:2.5.1',
                'androidx.lifecycle:lifecycle-livedata-core:2.5.1',
                'androidx.lifecycle:lifecycle-livedata-core-ktx:2.5.1',
                'androidx.lifecycle:lifecycle-process:2.5.1',
                'androidx.lifecycle:lifecycle-runtime:2.5.1',
                'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1',
                'androidx.lifecycle:lifecycle-service:2.5.1',
                'androidx.lifecycle:lifecycle-viewmodel:2.5.1',
                'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1',
                'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.5.1',
                'androidx.room:room-common:2.4.3',
                'androidx.room:room-compiler:2.4.3',
                'androidx.room:room-ktx:2.4.3',
                'androidx.room:room-runtime:2.4.3',
                'androidx.sqlite:sqlite:2.2.0',
                'androidx.sqlite:sqlite-framework:2.2.0',
                'androidx.savedstate:savedstate:1.2.0',
                'androidx.savedstate:savedstate-ktx:1.2.0',
                'androidx.annotation:annotation-experimental:1.3.0',
                'androidx.work:work-runtime:2.7.1',
                'androidx.test:core:1.5.0',
                'androidx.test:rules:1.5.0',
                'androidx.test.ext:junit:1.1.5',
                'androidx.test.espresso:espresso-core:3.5.1',
                'com.google.android.material:material:1.6.1',
                'com.google.firebase:firebase-analytics:21.3.0',
                'com.google.firebase:firebase-common:20.3.3',
                'com.google.firebase:firebase-common-ktx:20.3.3',
                'com.google.firebase:firebase-crashlytics:18.3.7',
                'com.google.firebase:firebase-installations:17.1.4',
                'com.google.firebase:firebase-installations-interop:17.1.0',
                'com.google.firebase:firebase-measurement-connector:20.0.0',
                'com.google.android.gms:play-services-measurement:21.3.0',
                'com.google.android.gms:play-services-measurement-api:21.3.0',
                'com.google.android.gms:play-services-measurement-base:21.3.0',
                'com.google.android.gms:play-services-measurement-impl:21.3.0',
                'com.google.android.gms:play-services-measurement-sdk:21.3.0',
                'com.google.android.gms:play-services-measurement-sdk-api:21.3.0'
        )
        resolutionStrategy.dependencySubstitution {
            substitute module('org.smartregister:opensrp-client-configurable-views') using module('io.github.bluecodesystems:opensrp-configurable-views:1.2.0')
            substitute module('org.smartregister:opensrp-client-utils') using module('io.github.bluecodesystems:opensrp-client-utils:0.0.6')
            substitute module('org.smartregister:opensrp-plan-evaluator') using module('io.github.bluecodesystems:opensrp-plan-evaluator:1.7.0')
            substitute module('org.smartregister:opensrp-client-simprints') using module('io.github.bluecodesystems:opensrp-client-simprints:1.1.0')
            substitute module('org.smartregister:opensrp-client-materialedittext') using module('io.github.bluecodesystems:materialedittext:3.1.6')
        }
    }

}

apply plugin : 'java'
apply plugin : 'build-dashboard'
apply plugin: 'io.codearte.nexus-staging'

buildDashboard {
    reports.html.setDestination(file("build/"))
}

tasks.withType(Test).configureEach {
    reports {
        html.required.set(false)
        junitXml.required.set(false)
    }
}


def isReleaseBuild() {
    return version.contains("SNAPSHOT") == false
}
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
