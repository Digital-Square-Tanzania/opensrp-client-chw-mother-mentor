---
name: step1_partner_non_attendance_reason_other
description: Require a written partner reason only when Other is selected
priority: 1
condition: "step1_partner_non_attendance_reason.contains('other')"
actions:
  - "isRelevant = true"

---
name: step1_partner_arrived_at_facility
description: Ask about attendance when the partner was found
priority: 1
condition: "step1_follow_up_status == 'found'"
actions:
  - "isRelevant = true"

---
name: step1_partner_facility_arrival_date
description: Require an arrival date only when the partner arrived
priority: 1
condition: "step1_follow_up_status == 'found' && step1_partner_arrived_at_facility == 'yes'"
actions:
  - "isRelevant = true"
