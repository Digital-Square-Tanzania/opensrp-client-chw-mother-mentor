---
name: step1_household_follow_up_status
description: Ask found status only for a household follow-up visit
priority: 1
condition: "step1_household_visit_type == 'repeat'"
actions:
  - "isRelevant = true"

---
name: step1_household_not_found_reason
description: Ask the reason only when the household was not found
priority: 1
condition: "step1_household_visit_type == 'repeat' && step1_household_follow_up_status == 'not_found'"
actions:
  - "isRelevant = true"

---
name: step1_household_not_found_reason_other
description: Require an explanation for another household not-found reason
priority: 1
condition: "step1_household_visit_type == 'repeat' && step1_household_follow_up_status == 'not_found' && step1_household_not_found_reason == 'other'"
actions:
  - "isRelevant = true"
