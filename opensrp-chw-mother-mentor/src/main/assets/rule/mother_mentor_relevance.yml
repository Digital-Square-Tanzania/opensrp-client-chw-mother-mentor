---
name: step2_art_start_date
description: mother mentor relevance
priority: 1
condition: "step2_art_status.equalsIgnoreCase('Yes')"
actions:
  - "isRelevant = true"
---
name: step2_art_no_reason
description: mother mentor relevance
priority: 1
condition: "step2_art_status.equalsIgnoreCase('No')"
actions:
  - "isRelevant = true"
---
name: step3_breastfeeding_status
description: Ask breastfeeding status only when the mother is not pregnant
priority: 1
condition: "step3_pregnancy_status_selection.equalsIgnoreCase('not_pregnant')"
actions:
  - "isRelevant = true"
---
name: step3_child_dob
description: mother mentor relevance
priority: 1
condition: "step3_pregnancy_status_selection.equalsIgnoreCase('not_pregnant')"
actions:
  - "isRelevant = true"
---
name: step3_child_over_18_months
description: Show child over 18 months toaster
priority: 1
condition: "!step3_child_dob.isEmpty() && helper.formatDate(step3_child_dob,'m') > 18"
actions:
  - "isRelevant = true"
---
name: step1_follow_up_status
description: mother mentor relevance
priority: 1
condition: "step1_attendance_type.equalsIgnoreCase('repeat')"
actions:
  - "isRelevant = true"
---
name: step1_topics_being_provided
description: mother mentor relevance
priority: 1
condition: "step1_education_provided.equalsIgnoreCase('yes')"
actions:
  - "isRelevant = true"
---
name: step1_way_education_provided
description: mother mentor relevance
priority: 1
condition: "step1_education_provided.equalsIgnoreCase('yes')"
actions:
  - "isRelevant = true"
---
name: step1_type_of_referral_given
description: mother mentor relevance
priority: 1
condition: "step1_referral_given.equalsIgnoreCase('yes')"
actions:
  - "isRelevant = true"
---
name: step3_last_test_results_returned
description: Ask whether results have returned only when a child EID test was performed
priority: 1
condition: "step3_last_test.equalsIgnoreCase('at_birth') || step3_last_test.equalsIgnoreCase('dbs_6') || step3_last_test.equalsIgnoreCase('dbs_9')"
actions:
  - "isRelevant = true"
---
name: step3_last_test_result
description: Capture a child EID result only after results have returned
priority: 1
condition: "(step3_last_test.equalsIgnoreCase('at_birth') || step3_last_test.equalsIgnoreCase('dbs_6') || step3_last_test.equalsIgnoreCase('dbs_9')) && step3_last_test_results_returned.equalsIgnoreCase('yes')"
actions:
  - "isRelevant = true"
